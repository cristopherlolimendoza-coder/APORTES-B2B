(async()=>{
 try{
  const b64=window.__PAGE_B64||'';
  const bin=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  const ds=new DecompressionStream('gzip');
  const reader=new Blob([bin]).stream().pipeThrough(ds).getReader();
  const chunks=[]; let total=0;
  while(true){const {value,done}=await reader.read(); if(done) break; chunks.push(value); total+=value.length;}
  const out=new Uint8Array(total); let offset=0;
  for(const chunk of chunks){out.set(chunk,offset); offset+=chunk.length;}
  const txt=new TextDecoder('utf-8').decode(out);
  document.open();document.write(txt);document.close();
 }catch(e){document.body.innerHTML='<pre style="padding:20px">Error al cargar HONOR Rewards: '+e+'</pre>'}
})();
</script></body></html>
