(async()=>{
 try{
  const b64=window.__PAGE_B64||'';
  const gzip=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));
  if(gzip.length<19||gzip[0]!==31||gzip[1]!==139) throw new Error('Contenido de HONOR Rewards incompleto');
  const raw=gzip.slice(10,gzip.length-8);
  const ds=new DecompressionStream('deflate-raw');
  const txt=await new Response(new Blob([raw]).stream().pipeThrough(ds)).text();
  document.open();document.write(txt);document.close();
 }catch(e){document.body.innerHTML='<pre style="padding:20px">Error al cargar HONOR Rewards: '+e+'</pre>'}
})();
</script></body></html>
