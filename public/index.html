<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HONOR B2B · Aportes Comercial V4</title><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><div id="boot" style="font-family:Arial,sans-serif;padding:24px;color:#334155">Cargando dashboard HONOR…</div><script>window.__honorParts=[];</script><script src="chunk1.js"></script><script src="chunk2.js"></script><script src="chunk3.js"></script><script src="chunk4.js"></script><script>(async()=>{try{const b64=window.__honorParts.join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let html;if(typeof DecompressionStream!=="undefined"){try{const ds=new DecompressionStream("gzip");html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();}catch(e){}}if(!html){if(!window.pako)throw new Error("No se pudo cargar el descompresor");html=new TextDecoder().decode(window.pako.ungzip(bytes));}const repls={"Ganadas, perdidas y oportunidades que continúan abiertas.":"Estado comercial de las cuentas. El aporte se controla por separado y solo se ejecuta con entrega confirmada.","Top clientes abiertos por inversión referencial":"Top clientes abiertos por aporte comprometido","Para propuestas con alternativas se usa la mayor exposición estimada, no la suma de todas las opciones.":"Para propuestas con alternativas se usa el mayor aporte comprometido estimado, no la suma de todas las opciones.","Pipeline activo":"Aportes en curso","Inversión ref.":"Aporte ref.","inversión referencial":"aporte referencial","['Pipeline ref.',money(inv.open),'Exposición abierta estimada','#7c3aed']":"['Aporte comprometido',money(inv.open),'Aprobado en cuentas En curso','#7c3aed']","$('mini').innerHTML=`<div><span>Inversión ref. ganada</span><b>${money(inv.win)}</b></div><div><span>Inversión ref. perdida</span><b>${money(inv.loss)}</b></div><div><span>Abiertas antiguas</span><b>${oldOpen}</b></div><div><span>Inversión ref. total</span><b>${money(totalInv)}</b></div>`;":"$('mini').innerHTML=`<div><span>Aporte aprobado · cuentas ganadas</span><b>${money(inv.win)}</b></div><div><span>Aporte liberado · cuentas perdidas</span><b>${money(inv.loss)}</b></div><div><span>Aporte comprometido · en curso</span><b>${money(inv.open)}</b></div><div><span>Aporte aprobado total</span><b>${money(totalInv)}</b></div>`;"};for(const [a,b] of Object.entries(repls))html=html.split(a).join(b);document.open();document.write(html);document.close();}catch(e){document.getElementById("boot").innerHTML="<b>No se pudo cargar el dashboard.</b><br><br>"+String(e);console.error(e);}})();</script></body></html>
