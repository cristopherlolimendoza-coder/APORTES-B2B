<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HONOR B2B · Aportes Comercial V4</title><script src="https://cdn.jsdelivr.net/npm/pako@2.1.0/dist/pako.min.js"></script></head><body><div id="boot" style="font-family:Arial,sans-serif;padding:24px;color:#334155">Cargando dashboard HONOR…</div><script>window.__honorParts=[];</script><script src="chunk1.js"></script><script src="chunk2.js"></script><script src="chunk3.js"></script><script src="chunk4.js"></script><script>(async()=>{try{const b64=window.__honorParts.join('');const bytes=Uint8Array.from(atob(b64),c=>c.charCodeAt(0));let html;if(typeof DecompressionStream!=="undefined"){try{const ds=new DecompressionStream("gzip");html=await new Response(new Blob([bytes]).stream().pipeThrough(ds)).text();}catch(e){}}if(!html){if(!window.pako)throw new Error("No se pudo cargar el descompresor");html=new TextDecoder().decode(window.pako.ungzip(bytes));}document.open();document.write(html);document.close();}catch(e){document.getElementById("boot").innerHTML="<b>No se pudo cargar el dashboard.</b><br><br>"+String(e);console.error(e);}})();</script></body></html>
